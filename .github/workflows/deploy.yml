# Baut die App und veroeffentlicht sie ueber GitHub Pages (HTTPS).
#
# Einmalig im Repository: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Danach startet jeder Push auf den Branch "main" diesen Ablauf automatisch (oder manuell ueber
# Actions -> "Deploy to GitHub Pages" -> "Run workflow").
#
# Schlaegt EIN Schritt fehl (Datenpruefung, Build, Build-Pruefung), wird NICHTS veroeffentlicht.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Sicherheitsnetz: private Dateien duerfen nie im Repository liegen.
      - name: Guard - no private files in the repository
        run: |
          if git ls-files | grep -Ei '\.(xlsx|xls|xlsm|xlsb|csv|docx|pptx|env|pem|key)$|handoff'; then
            echo "::error::Eine private Datei (z. B. die Excel-Uebergabedatei) ist im Repository enthalten. Abbruch."
            exit 1
          fi
          echo "Keine privaten Dateien im Repository gefunden."

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Check data (people, games, messages)
        run: npm run check
      - name: Build
        run: npm run build
      - name: Check build (privacy, subpath, iPhone/PWA, service worker, offline)
        run: npm run check:build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
